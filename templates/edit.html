{% extends "base.html" %}

{% block title %}
Редактировать: {{ track.title }}
{% endblock %}

{% block content %}

<h2>Редактировать трек</h2>

{% for error in errors|default([]) %}
    <p style="color: red;">{{ error }}</p>
{% endfor %}

<form method="POST">

    <p>
        <label>Название трека</label><br>
        <input type="text" name="title" value="{{ title|default('') }}">
    </p>

    <p>
        <label>Исполнитель</label><br>
        <input type="text" name="artist" value="{{ artist|default('') }}">
    </p>

    <p>
        <label>Жанр</label><br>
        <input type="text" name="genre" value="{{ genre|default('') }}">
    </p>

    <p>
        <label>
            <input type="checkbox" name="is_favorite" value="true" {% if is_favorite %}checked{% endif %}>
            Любимый трек ⭐️
        </label>
    </p>

    <button type="submit">Сохранить изменения</button>
    <a href="{{ url_for('detail', track_id=track.id) }}">Отмена</a>

</form>

{% endblock %}
